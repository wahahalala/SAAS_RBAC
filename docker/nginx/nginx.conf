# nginx.conf for the production deployment.
#
# Role: the single TLS/HTTP ingress for the app. It terminates traffic on :80
# (Compose usually fronts it with a TLS proxy or the cloud load balancer), serves
# the Next.js frontend and proxies `/api/*` to the NestJS API. Everything the
# browser needs lives on ONE origin, which is what the app's same-origin cookie
# design depends on (the refresh token must belong to the web host).
#
# Health/readiness: `/healthz` on the web app and `/api/v1/health` on the API
# are the probe targets — see the service healthchecks in docker-compose.prod.yml.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ------------------------------------------------------------------ logging
    # Structured-ish access log to stdout (Docker log driver captures it); error
    # log at warn to filter out the noise that 404 scans generate.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time';
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # ------------------------------------------------------------------- gzip
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml image/svg+xml;

    # ------------------------------------------------------------------ limits
    # Larger than the largest CSV/PDF download the API streams; proxy_buffering
    # is off for /api so downloads stream instead of spooling whole files to disk.
    client_max_body_size 10m;

    # ------------------------------------------------------------------ server
    server {
        listen 80 default_server;
        server_name _;

        # ---------------------------------------------------------------------
        # Security headers. `frame-ancestors` and CSP are deliberately basic here:
        # tighten them per deployment (Stripe/analytics domains go in CSP).
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

        # -------------------------------------------------------------------
        # Liveness probe (no cache, no redirect).
        location = /healthz {
            proxy_pass         http://web:3000/api/healthz;
            proxy_set_header   Host $host;
            access_log         off;
        }

        # -------------------------------------------------------------------
        # Next.js frontend + its BFF rewrite handles /api/v1/* itself (see
        # next.config.ts). Proxied to the web server, not the API: the web app
        # must own the API surface so the refresh cookie stays on THIS origin.
        location / {
            proxy_pass         http://web:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_cache_bypass $http_upgrade;
        }

        # -------------------------------------------------------------------
        # Static assets: serve immutable content with a long cache and skip the
        # upstream for a whole year (Next fingerprints /_next/static files).
        location /_next/static/ {
            proxy_pass         http://web:3000;
            proxy_set_header   Host $host;
            proxy_cache_bypass $http_upgrade;
            expires            1y;
            add_header         Cache-Control "public, immutable";
        }
    }
}
